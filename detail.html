<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Resep - ResepKu</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <nav class="bg-white shadow">
      <div class="max-w-4xl mx-auto px-4 py-4 flex items-center">
        <a
          href="index.html"
          class="text-gray-500 hover:text-orange-500 flex items-center gap-2"
        >
          &larr; Kembali ke Daftar Resep
        </a>
      </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <h1 id="detail-title" class="text-4xl font-extrabold text-gray-900 mb-4">
        Loading...
      </h1>

      <img
        id="detail-image"
        src=""
        alt="Loading"
        class="w-full h-96 object-cover rounded-xl shadow-md mb-8"
      />

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div id="detail-bahan"></div>
        <div class="md:col-span-2">
          <h2 class="text-2xl font-bold mb-4">Cara Memasak</h2>
          <!-- handle desc disini -->
          <div id="detail-langkah"></div>

          <h3 class="text-xl font-bold mb-4">Video Tutorial</h3>
          <div
            class="w-full aspect-video rounded-lg overflow-hidden shadow-lg bg-black"
          >
            <iframe
              id="detail-video"
              class="w-full h-full"
              src=""
              frameborder="0"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </div>

      <div class="mt-12 pt-8 border-t border-gray-200">
        <h2 id="rating-summary" class="text-2xl font-bold mb-6">
          Ulasan & Rating
        </h2>

        <div id="comments-container" class="space-y-6 mb-8"></div>

        <div class="bg-orange-50 p-6 rounded-lg border border-orange-100">
          <span class="text-neutral-400"
            ><a href="./login.html" class="text-blue-400 underline">Login</a>
            terlebih dahulu untuk memberikan ulasan.</span
          >
        </div>
      </div>
    </main>

    <script src="data.js"></script>

    <script>
      const urlParams = new URLSearchParams(window.location.search)
      const recipeId = parseInt(urlParams.get('id'))

      const recipe = recipes.find((r) => r.id === recipeId)

      function generateStars(rating) {
        let starsHTML = ''
        for (let i = 1; i <= 5; i++) {
          if (i <= rating) {
            starsHTML += `<img src="./assets/ic_yellow_star.svg" class="w-5 h-5" alt="Bintang Aktif">`
          } else {
            starsHTML += `<img src="./assets/ic_gray_star.svg" class="w-5 h-5" alt="Bintang Redup">`
          }
        }
        return `<div class="flex gap-1">${starsHTML}</div>`
      }

      function getInitial(name) {
        return name
          .split(' ')
          .map((n) => n[0])
          .join('')
          .substring(0, 2)
          .toUpperCase()
      }

      if (recipe) {
        document.title = recipe.title + ' - ResepKu'
        document.getElementById('detail-title').innerText = recipe.title
        document.getElementById('detail-image').src = recipe.image

        document.getElementById('detail-video').src = recipe.video
        document.getElementById('detail-bahan').innerHTML = recipe.bahan
        document.getElementById('detail-langkah').innerHTML = recipe.langkah

        const commentsContainer = document.getElementById('comments-container')
        const ratingSummary = document.getElementById('rating-summary')

        if (recipe.komentar && recipe.komentar.length > 0) {
          const totalRating = recipe.komentar.reduce(
            (acc, curr) => acc + curr.rating,
            0,
          )
          const avgRating = (totalRating / recipe.komentar.length).toFixed(1)
          ratingSummary.innerText = `Ulasan & Rating (${avgRating}/5)`

          const commentsHTML = recipe.komentar
            .map(
              (komen) => `
                <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 font-bold">
                                ${getInitial(komen.nama)}
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-800">${komen.nama}</h4>
                                <p class="text-xs text-gray-500">${komen.tanggal}</p>
                            </div>
                        </div>
                        <!-- Panggil fungsi generate bintang -->
                        ${generateStars(komen.rating)}
                    </div>
                    <p class="text-gray-700">${komen.teks}</p>
                </div>
            `,
            )
            .join('')

          commentsContainer.innerHTML = commentsHTML
        } else {
          ratingSummary.innerText = `Ulasan & Rating (Belum ada ulasan)`
          commentsContainer.innerHTML = `<p class="text-gray-500 italic">Belum ada komentar untuk resep ini. Jadilah yang pertama!</p>`
        }
      } else {
        document.getElementById('detail-title').innerText =
          'Resep Tidak Ditemukan'
        document.getElementById('detail-desc').innerText =
          'Maaf, resep yang Anda cari tidak ada.'
      }
    </script>
  </body>
</html>
